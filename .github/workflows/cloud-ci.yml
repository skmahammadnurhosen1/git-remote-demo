name: Cloud CI Pipeline

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code from Cloud Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment in Cloud
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Cloud Automated Tests
        run: |
          echo "Running remote tests on GitHub Cloud Runner (Ubuntu)..."
          node demo.js
          echo "All Cloud CI tests passed successfully!"
